name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install hypr-doctor
      run: |
        pip install git+https://github.com/apravint/hypr-doctor.git
    - name: Audit Hyprland Configuration
      run: |
        hypr-doctor check hypr/hyprland.conf
    - name: Check install script syntax
      run: |
        bash -n install.sh
